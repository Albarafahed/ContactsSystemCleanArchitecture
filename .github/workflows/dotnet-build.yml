name: .NET Build

on:
  push:
    branches:
      - master
      - feature/user-owned-contacts-auth
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ContactSystemApi/ContactsSystemApi.csproj
      - name: Build
        run: dotnet build ContactSystemApi/ContactsSystemApi.csproj --configuration Release --no-restore
